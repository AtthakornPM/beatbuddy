<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหาเพลง BeatBuddy</title>
<meta name="description" content="ค้นหาว่าเพลงไหนใช้บีตอะไรใน BeatBuddy โดยกลุ่ม BeatBuddy Thailand">
<meta property="og:title" content="ค้นหาเพลง BeatBuddy">
<meta property="og:description" content="พิมพ์ชื่อเพลงหรือศิลปิน แล้วดูว่าใช้บีต แนว และ BPM อะไรใน BeatBuddy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#141A21;--muted:#5A6573;--line:#D3DAE2;--accent:#2152C4;--accent-ink:#fff;--lcd:#1C1A16;--amber:#FFB547;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#171C23;--ink:#E6EBF1;--muted:#97A2B0;--line:#29313B;--accent:#3E6BE0;--lcd:#08090B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--accent);color:var(--accent-ink);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{margin:0 0 10px;font-size:19px;line-height:1.3}
.row{display:flex;gap:8px}
input,select{font:inherit;color:#141A21;background:#fff;border:0;border-radius:10px;padding:11px 12px;min-width:0}
input{flex:1;font-size:16px}
select{max-width:42%;font-size:15px}
input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.count{font-size:13px;opacity:.92;margin-top:8px;min-height:1.5em}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.a{color:var(--muted);font-size:14px}
.beat{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:14px}
.folder{border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:600}
@media (prefers-color-scheme:dark){.folder{border-color:#7099FF;color:#7099FF}}
.lcd{background:var(--lcd);color:var(--amber);font:600 16px "IBM Plex Mono",ui-monospace,monospace;border-radius:6px;padding:4px 8px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.lcd small{font-size:10px;opacity:.8}
.sig{font:600 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);text-align:right;margin-top:2px}
.meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
.state{text-align:center;color:var(--muted);padding:40px 8px}
.state button{margin-top:12px;font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px}
footer{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 32px}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ค้นหาเพลง BeatBuddy</h1>
    <div class="row">
      <input id="q" type="search" placeholder="ชื่อเพลง ศิลปิน หรือชื่อบีต" aria-label="ค้นหา" autocomplete="off" disabled>
      <select id="g" aria-label="แนว" disabled><option value="">ทุกแนว</option></select>
    </div>
    <div class="count" id="count" aria-live="polite">กำลังโหลดรายการเพลง…</div>
  </div>
</header>
<main class="wrap">
  <div class="list" id="list"><div class="state">กำลังโหลดรายการเพลง…</div></div>
</main>
<footer>ข้อมูลจากสมาชิกกลุ่ม <a href="https://www.facebook.com/groups/beatbuddythailand" target="_blank" rel="noopener">BeatBuddy Thailand</a> · <a href="https://forms.gle/G9F6hYDKT3pdkmgw9" target="_blank" rel="noopener">ส่งเพลงเพิ่ม</a></footer>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbxW9NnLLclCByR808jD3l60wpwUnzqrkDlPti9d0Xwq75AsRIWMXfMBx7Drj4_ur_bi0Q/exec?format=json';
  var CACHE_KEY = 'bb-songs-v1';
  var SONGS = [], IDX = [];
  function $(id){ return document.getElementById(id); }
  function norm(s){ return String(s == null ? '' : s).toLowerCase().replace(/\s+/g,' ').trim(); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function setData(songs){
    SONGS = songs || [];
    IDX = SONGS.map(function(r){ return norm([r[0],r[1],r[2],r[3],r[6]].join(' ')); });
    var sel = $('g'), cur = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    var seen = {}, genres = [];
    SONGS.forEach(function(r){ if (r[2] && !seen[r[2]]) { seen[r[2]] = 1; genres.push(r[2]); } });
    genres.sort(function(a,b){ return a.localeCompare(b,'th'); }).forEach(function(g){
      var o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o);
    });
    sel.value = cur;
    $('q').disabled = false; sel.disabled = false;
    render();
  }

  function render(){
    var q = norm($('q').value), g = $('g').value, list = $('list');
    var words = q ? q.split(' ') : [];
    var hits = [];
    for (var i = 0; i < SONGS.length; i++) {
      if (g && SONGS[i][2] !== g) continue;
      var ok = true;
      for (var w = 0; w < words.length; w++) { if (IDX[i].indexOf(words[w]) === -1) { ok = false; break; } }
      if (ok) hits.push(SONGS[i]);
    }
    list.textContent = '';
    $('count').textContent = 'พบ ' + hits.length + ' จาก ' + SONGS.length + ' รายการ';
    if (!hits.length) { list.appendChild(el('div','state','ไม่พบเพลงที่ค้นหา ลองพิมพ์คำอื่น หรือส่งเพลงนี้เข้าตารางผ่านลิงก์ด้านล่าง')); return; }
    var frag = document.createDocumentFragment();
    hits.slice(0, 300).forEach(function(r){
      var c = el('div','card');
      var left = el('div'); left.appendChild(el('div','t',r[0])); if (r[1]) left.appendChild(el('div','a',r[1]));
      c.appendChild(left);
      var right = el('div');
      if (r[4]) { var l = el('div','lcd',r[4] + ' '); l.appendChild(el('small',null,'BPM')); right.appendChild(l); }
      if (r[5]) right.appendChild(el('div','sig',r[5]));
      c.appendChild(right);
      var b = el('div','beat');
      if (r[2]) b.appendChild(el('span','folder',r[2]));
      if (r[3]) b.appendChild(el('span',null,r[3]));
      if (r[6]) b.appendChild(el('span','a','· ชุดกลอง ' + r[6]));
      c.appendChild(b);
      var meta = [r[7], r[8] ? 'เพิ่มโดย ' + r[8] : ''].filter(Boolean).join(' · ');
      if (meta) c.appendChild(el('div','meta',meta));
      frag.appendChild(c);
    });
    list.appendChild(frag);
    if (hits.length > 300) list.appendChild(el('div','state','แสดง 300 รายการแรก พิมพ์คำค้นเพิ่มเพื่อให้แคบลง'));
  }

  function showError(){
    if (SONGS.length) { $('count').textContent += ' (ข้อมูลล่าสุดที่เคยโหลดไว้)'; return; }
    var list = $('list'); list.textContent = '';
    var s = el('div','state','โหลดรายการเพลงไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');
    var btn = el('button',null,'ลองอีกครั้ง'); btn.type = 'button'; btn.addEventListener('click', load);
    s.appendChild(el('br')); s.appendChild(btn); list.appendChild(s);
    $('count').textContent = '';
  }

  function load(){
    fetch(API, { credentials: 'omit' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        setData(j.songs);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(j.songs)); } catch (e) {}
      })
      .catch(showError);
  }

  $('q').addEventListener('input', render);
  $('g').addEventListener('change', render);
  try { var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (cached && cached.length) setData(cached); } catch (e) {}
  load();
})();
</script>
</body>
</html>
